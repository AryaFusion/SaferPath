[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "saferpath-backend"
version = "0.1.0"
description = "SaferPath backend API"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "orjson>=3.10,<4.0",
    "structlog>=25.1,<26.0",
    "slowapi>=0.1.9,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.11,<1.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "migrations*",
    "tests*",
    "scripts*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E402"]