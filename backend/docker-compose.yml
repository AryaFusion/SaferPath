services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: saferpath-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: saferpath
      POSTGRES_PASSWORD: saferpath
      POSTGRES_DB: saferpath

    ports:
      - "5435:5432"

    volumes:
      - saferpath_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferpath -d saferpath"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saferpath_postgres_data:
